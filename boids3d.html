<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boids 3D シミュレーション</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b4657; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #panel {
    --panel-border: rgba(139, 223, 209, 0.32);
    --panel-control: rgba(30, 99, 103, 0.48);
    position: fixed; top: 12px; left: 12px;
    background: rgba(8, 38, 48, 0.91); color: #e2f4ef;
    border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 14px 16px; font-size: 13px; width: 250px;
    backdrop-filter: blur(6px); user-select: none; z-index: 10;
    max-height: calc(100% - 24px); overflow-y: auto;
  }
  #panel h1 { font-size: 15px; margin-bottom: 10px; color: #a0e9d8; }
  .rule { margin-bottom: 10px; }
  .rule-head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  #panel input { accent-color: #76d8c7; }
  .rule-head label { cursor: pointer; }
  input[type=range] { width: 100%; }
  .row { display: flex; justify-content: space-between; margin: 8px 0 2px; }
  .val { color: #a4d5cb; font-variant-numeric: tabular-nums; }
  #panel :is(button, select) {
    border: 1px solid var(--panel-border); background: var(--panel-control);
    color: inherit; font-size: 13px;
  }
  button {
    width: 100%; margin-top: 8px; padding: 6px; border-radius: 6px;
    cursor: pointer;
  }
  #panel button:hover { background: rgba(53, 135, 128, 0.62); }
  select {
    width: 100%; margin-top: 2px; padding: 4px; border-radius: 6px;
    color-scheme: dark;
  }
  #hint { margin-top: 10px; font-size: 11px; color: #a6c5c2; line-height: 1.5; }
  #panelToggle, .touch-hint { display: none; }

  @media (max-width: 640px), (pointer: coarse) and (max-height: 570px) {
    #panel {
      top: auto;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      width: auto;
      max-height: 56vh;
      max-height: 56dvh;
      padding: 0;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      flex: none;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 6px 14px;
    }
    #panel h1 { margin: 0; }
    #panelToggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      width: auto;
      margin: 0;
      padding: 0 12px;
      font-weight: 600;
    }
    #panelToggle::after {
      content: "";
      width: 7px;
      height: 7px;
      border-top: 2px solid currentColor;
      border-right: 2px solid currentColor;
      transform: translateY(2px) rotate(-45deg);
    }
    #panelToggle[aria-expanded="true"]::after {
      transform: translateY(-2px) rotate(135deg);
    }
    #panelContent {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      padding: 8px 14px 14px;
      border-top: 1px solid var(--panel-border);
    }
    #panel:not(.expanded) #panelContent { display: none; }
    #panelContent .rule-head { min-height: 34px; gap: 10px; }
    #panelContent .rule-head input { width: 18px; height: 18px; flex: none; }
    #panelContent .rule-head label { flex: 1; line-height: 1.4; padding-block: 7px; }
    #panelContent input[type=range] { display: block; min-height: 30px; }
    #panelContent :is(select, button) { min-height: 44px; }
    .desktop-hint { display: none; }
    .touch-hint { display: inline; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<aside id="panel" aria-label="Boids 3D の設定">
  <div class="panel-header">
    <h1>Boids 3D</h1>
    <button type="button" id="panelToggle" aria-expanded="false" aria-controls="panelContent">パラメータ</button>
  </div>
  <div id="panelContent">
    <div class="rule">
      <div class="rule-head">
        <input type="checkbox" id="alignOn" checked>
        <label for="alignOn">群れと同じ方向に泳ごう</label>
      </div>
      <input type="range" id="alignW" min="0" max="3" step="0.1" value="1.0">
    </div>

    <div class="rule">
      <div class="rule-head">
        <input type="checkbox" id="cohesionOn" checked>
        <label for="cohesionOn">群れの中心に集まろう</label>
      </div>
      <input type="range" id="cohesionW" min="0" max="3" step="0.1" value="0.8">
    </div>

    <div class="rule">
      <div class="rule-head">
        <input type="checkbox" id="separationOn" checked>
        <label for="separationOn">他の魚と衝突しないように</label>
      </div>
      <input type="range" id="separationW" min="0" max="3" step="0.1" value="1.5">
    </div>

    <div class="row" style="margin-top: 12px;"><span>近傍の定義（整列・結合）</span></div>
    <div class="rule-head">
      <input type="radio" name="mode" id="modeMetric" checked>
      <label for="modeMetric">距離で見る（半径R以内の全員）</label>
    </div>
    <div class="rule-head">
      <input type="radio" name="mode" id="modeTopo">
      <label for="modeTopo">数で見る（近い順にk匹）</label>
    </div>
    <div class="row"><span>k（見る数）</span><span class="val" id="kVal">7</span></div>
    <input type="range" id="kNeighbors" min="1" max="15" step="1" value="7">

    <div class="row"><span>個体数</span><span class="val" id="countVal">100</span></div>
    <input type="range" id="count" min="10" max="500" step="10" value="100">

    <div class="row"><span>視界半径</span><span class="val" id="perceptionVal">14</span></div>
    <input type="range" id="perception" min="5" max="30" step="1" value="14">

    <div class="row"><span>最高速度</span><span class="val" id="speedVal">0.2</span></div>
    <input type="range" id="speed" min="0.2" max="4" step="0.1" value="0.2">

    <div class="row"><span>整列度 φ</span><span class="val" id="phiVal">–</span></div>

    <div class="row" style="margin-top: 12px;"><span>魚の種類</span></div>
    <select id="fishType">
      <option value="default" selected>標準</option>
      <option value="aji">アジ風（銀色）</option>
      <option value="kumanomi">クマノミ風（オレンジ）</option>
    </select>

    <div class="row" style="margin-top: 12px;"><span>水流</span></div>
    <select id="flowType">
      <option value="none" selected>なし</option>
      <option value="current">海流（一定方向）</option>
      <option value="vortex">渦（中心軸まわり）</option>
      <option value="turbulence">乱流（ゆらぎ）</option>
    </select>
    <div class="row"><span>流速</span><span class="val" id="flowVal">0.1</span></div>
    <input type="range" id="flowStrength" min="0" max="0.5" step="0.02" value="0.1">

    <button id="attackSimple">捕食者アタック（シンプル版）</button>
    <button id="attackAbm">捕食者アタック（ABM版）</button>
    <button id="addObstacle">障害物を追加</button>
    <button id="clearObstacles">障害物をクリア</button>
    <div id="hint">
      <span class="desktop-hint">ドラッグ：視点回転<br>ホイール：ズーム<br>右ドラッグ：平行移動</span>
      <span class="touch-hint">1本指で回転・ピンチでズーム・2本指で移動</span>
      <br>分離（衝突回避）は常に半径Rベース
    </div>
  </div>
</aside>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

const panel = document.getElementById("panel");
const panelToggle = document.getElementById("panelToggle");
panelToggle.addEventListener("click", () => {
  const expanded = panel.classList.toggle("expanded");
  panelToggle.setAttribute("aria-expanded", String(expanded));
});

// ---- シーン ----
const scene = new THREE.Scene();
const deepWater = new THREE.Color(0x0b4657);
const waterPalette = {
  deepWater: { value: deepWater },
  shallowWater: { value: new THREE.Color(0x40a9a4) },
};
const waterColorGLSL = `
  uniform vec3 deepWater;
  uniform vec3 shallowWater;

  vec3 waterColor(vec3 direction) {
    float surface = smoothstep(-0.19, 0.38, direction.y);
    return mix(deepWater, shallowWater, surface);
  }
`;
scene.background = deepWater;
scene.fog = new THREE.Fog(deepWater, 105, 330);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(93, 61, 117);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, -9, 0);

scene.add(new THREE.HemisphereLight(0xc8f6f2, 0x53777a, 1.45));
const dirLight = new THREE.DirectionalLight(0xe6f9f2, 1.2);
dirLight.position.set(-78, 48, -56);
scene.add(dirLight);

// 見上げるほど浅瀬の色に近づく。
const waterBackdrop = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthTest: false,
  depthWrite: false,
  uniforms: waterPalette,
  vertexShader: `
    varying vec3 waterDirection;
    void main() {
      waterDirection = position;
      vec4 clip = projectionMatrix * vec4(mat3(viewMatrix) * position, 1.0);
      gl_Position = clip.xyww;
    }
  `,
  fragmentShader: waterColorGLSL + `
    varying vec3 waterDirection;

    void main() {
      gl_FragColor = vec4(waterColor(normalize(waterDirection)), 1.0);
      #include <colorspace_fragment>
    }
  `,
}));
waterBackdrop.frustumCulled = false;
waterBackdrop.renderOrder = -1;
scene.add(waterBackdrop);

// 遊泳領域（水槽風の箱）
const BOUNDS = new THREE.Vector3(70, 45, 70); // 半サイズ
const FLOOR_Y = -BOUNDS.y + 3; // 海底の高さ。魚もサメもこれより下には行けない
const SAND_Y = -BOUNDS.y - 0.5;
const boundsGeo = new THREE.BoxGeometry(BOUNDS.x * 2, BOUNDS.y * 2, BOUNDS.z * 2);

const boundsBox = new THREE.LineSegments(
  new THREE.EdgesGeometry(boundsGeo),
  new THREE.LineBasicMaterial({ color: 0xb2eee5, transparent: true, opacity: 0.24 })
);
scene.add(boundsBox);

// ---- 海底の景観 ----
function seabedY(x, z) {
  const shelf = THREE.MathUtils.smoothstep(Math.hypot(x, z), 82, 202);
  const banks = 1.38 * Math.sin(0.047 * x + 0.023 * z) * Math.cos(0.034 * z - 0.014 * x);
  const ripples = 0.54 * Math.sin(0.093 * x - 0.073 * z) * Math.cos(0.071 * z + 0.03 * x);
  return SAND_Y + (banks + ripples) * (1 + shelf * 3.2) - shelf * 16;
}

const sandMat = new THREE.MeshStandardMaterial({ color: 0xc6b38a, roughness: 1 });
sandMat.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, waterPalette);
  shader.vertexShader = "varying vec3 sandPosition;\n" + shader.vertexShader.replace(
    "#include <begin_vertex>",
    "#include <begin_vertex>\nsandPosition = (modelMatrix * vec4(position, 1.0)).xyz;"
  );
  shader.fragmentShader = waterColorGLSL + `
    varying vec3 sandPosition;
    float grain(vec2 p) {
      return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
    }
  ` + shader.fragmentShader.replace("#include <color_fragment>", `
    #include <color_fragment>
    vec2 q = sandPosition.xz;
    float ripple = sin(dot(q, vec2(0.45, 1.1)) + 1.7 * sin(q.x * 0.18 + q.y * 0.11));
    float fineDetail = 1.0 - smoothstep(0.2, 0.9, length(fwidth(q)));
    float speckle = grain(floor(q * 8.0)) - 0.5;
    float patches = sin(q.x * 0.07 - q.y * 0.062) * cos(q.x * 0.044 + q.y * 0.091);
    vec3 sandTint = mix(vec3(0.78, 0.84, 0.85), vec3(1.04, 1.01, 0.95), 0.5 + 0.5 * patches);
    diffuseColor.rgb *= sandTint * (0.92 + (0.075 * ripple + 0.18 * speckle) * fineDetail);
  `).replace("#include <fog_fragment>", `
    #ifdef USE_FOG
      // 遠い海底を、同じ視線方向の背景色へ溶け込ませる。
      vec3 horizon = waterColor(normalize(sandPosition - cameraPosition));
      float haze = smoothstep(fogNear, fogFar, vFogDepth);
      gl_FragColor.rgb = mix(gl_FragColor.rgb, linearToOutputTexel(vec4(horizon, 1.0)).rgb, haze);
    #endif
  `);
};
const seabedGeometry = new THREE.PlaneGeometry(2, 2, 192, 192);
seabedGeometry.rotateX(-Math.PI / 2);
const seabedVertices = seabedGeometry.getAttribute("position");
// 魚や岩に近い中央は細かく、霞に隠れる遠景は粗い間隔で分割する。
const seabedAxis = u => 184 * u + 396 * u * Math.pow(u, 4);
for (let i = 0; i < seabedVertices.count; i++) {
  const x = seabedAxis(seabedVertices.getX(i));
  const z = seabedAxis(seabedVertices.getZ(i));
  seabedVertices.setXYZ(i, x, seabedY(x, z), z);
}
seabedGeometry.computeVertexNormals();
scene.add(new THREE.Mesh(seabedGeometry, sandMat));

// カメラを開き直しても岩礁や海藻は同じ場所に生える。
let habitatSeed = 86241;
function habitatRandom() {
  habitatSeed = (Math.imul(1664525, habitatSeed) + 1013904223) >>> 0;
  return habitatSeed / 4294967296;
}

function createReefRock(x, z, width, height, depth) {
  const sphere = new THREE.IcosahedronGeometry(1, width > 4 ? 8 : 3);
  sphere.deleteAttribute("uv");
  sphere.deleteAttribute("normal");
  const geometry = mergeVertices(sphere);
  const vertices = geometry.getAttribute("position");
  const colors = new Float32Array(vertices.count * 3);
  const color = new THREE.Color();
  const stone = new THREE.Color(0x777668);
  const algae = new THREE.Color(0x506144);
  const phase = habitatRandom() * Math.PI * 2;
  const rootY = seabedY(x, z);
  const angle = phase * 1.3;
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  for (let i = 0; i < vertices.count; i++) {
    const vx = vertices.getX(i);
    const vy = vertices.getY(i);
    const vz = vertices.getZ(i);
    const folds = Math.sin(3.8 * vx + 1.5 * vy + phase) * Math.cos(4.6 * vz - 2 * vy);
    const grain = Math.sin(13 * vx + 7 * vz) * Math.cos(12 * vy - 6 * vz + phase);
    const radius = 1 + 0.21 * folds + 0.075 * grain;
    const stratum = Math.sin(14 * vy + 2 * vx - 3 * vz + 0.8 * folds);
    const cover = THREE.MathUtils.clamp(0.28 + 0.42 * folds + 0.24 * vy, 0, 0.82);
    color.copy(stone).lerp(algae, cover)
      .multiplyScalar(0.73 + 0.22 * vy + 0.16 * folds + 0.12 * stratum + 0.09 * grain);
    color.toArray(colors, i * 3);
    const localX = (vx * radius + 0.15 * vy) * width;
    const localZ = vz * radius * depth;
    vertices.setXYZ(i, x + localX * cos - localZ * sin,
      rootY + (0.18 + vy * radius) * height, z + localX * sin + localZ * cos);
  }
  geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geometry.computeVertexNormals();
  return geometry;
}

const reefRegions = [
  [
    { x: 41, z: 6, size: 12, plants: 12 },
    { x: -23, z: 35, size: 10, plants: 11 },
    { x: -47, z: -14, size: 13, plants: 12 },
    { x: 11, z: -45, size: 11, plants: 10 },
    { x: -38, z: -49, size: 7, plants: 6 },
  ],
  [
    { x: 100, z: 28, size: 23, plants: 10, shape: 0.74 },
    { x: 94, z: -42, size: 20, plants: 9, shape: 1.35 },
    { x: 151, z: -34, size: 28, plants: 5, shape: 1.12 },
    { x: 131, z: 87, size: 16, plants: 5, shape: 0.90 },
  ],
  [
    { x: 27, z: 95, size: 14, plants: 9, shape: 0.67 },
    { x: -33, z: 91, size: 21, plants: 11, shape: 0.86 },
    { x: -86, z: 129, size: 26, plants: 7, shape: 1.1 },
    { x: 49, z: 165, size: 29, plants: 6, shape: 0.78 },
  ],
  [
    { x: -97, z: 25, size: 22, plants: 8, shape: 0.85 },
    { x: -101, z: -37, size: 24, plants: 7, shape: 1.25 },
    { x: -157, z: 5, size: 28, plants: 5, shape: 1.15 },
  ],
  [
    { x: 48, z: -91, size: 19, plants: 9, shape: 0.8 },
    { x: -21, z: -99, size: 21, plants: 8, shape: 0.9 },
    { x: -77, z: -141, size: 30, plants: 7, shape: 1.3 },
    { x: 42, z: -154, size: 25, plants: 5, shape: 1.1 },
  ],
];

const rockMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96 });
rockMat.onBeforeCompile = shader => {
  shader.vertexShader = "varying vec3 rockPosition;\n" + shader.vertexShader.replace(
    "#include <begin_vertex>", "#include <begin_vertex>\nrockPosition = position;"
  );
  shader.fragmentShader = `
    varying vec3 rockPosition;
    float rockGrain(vec3 cell) {
      vec3 p = fract(cell * vec3(0.1031, 0.11369, 0.13787));
      p += dot(p, p.yzx + 19.19);
      return fract((p.x + p.y) * p.z);
    }
    float rockNoise(vec3 point) {
      vec3 cell = floor(point);
      vec3 f = smoothstep(0.0, 1.0, fract(point));
      float bottom = mix(
        mix(rockGrain(cell), rockGrain(cell + vec3(1, 0, 0)), f.x),
        mix(rockGrain(cell + vec3(0, 0, 1)), rockGrain(cell + vec3(1, 0, 1)), f.x), f.z
      );
      float top = mix(
        mix(rockGrain(cell + vec3(0, 1, 0)), rockGrain(cell + vec3(1, 1, 0)), f.x),
        mix(rockGrain(cell + vec3(0, 1, 1)), rockGrain(cell + vec3(1, 1, 1)), f.x), f.z
      );
      return mix(bottom, top, f.y);
    }
  ` + shader.fragmentShader.replace("#include <color_fragment>", `
    #include <color_fragment>
    vec3 p = rockPosition;
    float mottling = rockNoise(p * vec3(0.34, 0.57, 0.34));
    float detail = 1.0 - smoothstep(0.30, 1.65, length(fwidth(p)));
    float mineralGrain = rockNoise(p * 2.1) - 0.5;
    float layers = sin(dot(p, vec3(0.15, 1.13, 0.11)) + 5.4 * mottling);
    diffuseColor.rgb *= 0.79 + 0.43 * mottling + detail * (0.10 * layers + 0.31 * mineralGrain);
    diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(1.17, 1.11, 0.84),
      0.55 * smoothstep(0.54, 0.77, mottling));
  `);
};

const shadowMat = new THREE.MeshBasicMaterial({ color: 0x182923, transparent: true, depthWrite: false });
shadowMat.onBeforeCompile = shader => {
  shader.vertexShader = "varying vec2 shadowUv;\n" + shader.vertexShader.replace(
    "#include <begin_vertex>", "#include <begin_vertex>\nshadowUv = uv;"
  );
  shader.fragmentShader = "varying vec2 shadowUv;\n" + shader.fragmentShader.replace(
    "#include <color_fragment>",
    "#include <color_fragment>\ndiffuseColor.a *= 0.38 * (1.0 - smoothstep(0.1, 0.5, length(shadowUv - 0.5)));"
  );
};

function addReef(patches) {
  const rocks = [];
  const shadows = [];
  for (const { x, z, size, shape = 1 } of patches) {
    const rockCount = size < 16 ? 25 : 19;
    for (let i = 0; i < rockCount; i++) {
      const angle = habitatRandom() * Math.PI * 2;
      const distance = size * (0.45 + habitatRandom() * 1.4);
      const radius = i < 13 ? size * (0.12 + habitatRandom() * 0.56) : 0.3 + habitatRandom() * 1.6;
      const rockX = i === 0 ? x : x + Math.cos(angle) * distance;
      const rockZ = i === 0 ? z : z + Math.sin(angle) * distance;
      const width = i === 0 ? size : radius;
      const depth = width * (0.55 + habitatRandom() * 0.52);
      const rockHeight = width * (0.46 + 0.49 * habitatRandom()) * shape;
      rocks.push(createReefRock(rockX, rockZ, width, rockHeight, depth));

      const shadowSize = 2.7 * (width + depth) / 2;
      const divisions = Math.ceil(width / 4);
      const shadow = new THREE.PlaneGeometry(shadowSize, shadowSize, divisions, divisions);
      shadow.rotateX(-Math.PI / 2).translate(rockX, 0, rockZ);
      const vertices = shadow.getAttribute("position");
      for (let j = 0; j < vertices.count; j++) {
        vertices.setY(j, seabedY(vertices.getX(j), vertices.getZ(j)) + 0.09);
      }
      shadows.push(shadow);
    }
  }

  scene.add(new THREE.Mesh(mergeGeometries(rocks), rockMat));
  scene.add(new THREE.Mesh(mergeGeometries(shadows), shadowMat));
}

function createKelpGeometry(patches) {
  const positions = [];
  const colors = [];
  const bends = [];
  const indices = [];
  const dark = new THREE.Color();
  const light = new THREE.Color();
  const color = new THREE.Color();

  for (const { x, z, size, plants } of patches) {
    for (let plant = 0; plant < plants; plant++) {
      const azimuth = habitatRandom() * Math.PI * 2;
      const distance = size * (0.7 + 0.87 * habitatRandom());
      const rootX = x + Math.cos(azimuth) * distance;
      const rootZ = z + Math.sin(azimuth) * distance;
      const rootY = seabedY(rootX, rootZ) - 0.13;
      const height = 6 + Math.min(22, size * 1.55) * Math.pow(habitatRandom(), 1.3);
      const angle = habitatRandom() * Math.PI * 2;
      const green = habitatRandom() > 0.42;
      dark.set(green ? 0x344c26 : 0x4b4227);
      light.set(green ? 0x8e9b49 : 0x9e773d);
      const stemAt = t => new THREE.Vector3(
        Math.cos(angle) * height * (0.13 * t * t + 0.035 * Math.sin(t * 6)),
        height * t,
        Math.sin(angle) * height * (0.13 * t * t + 0.035 * Math.sin(t * 6))
      );

      function addRibbon(path, facing, widthAt, fold, segments) {
        const first = positions.length / 3;
        for (let section = 0; section <= segments; section++) {
          const t = section / segments;
          const point = path(t);
          const tangent = path(Math.min(t + 0.01, 1)).sub(path(Math.max(0, t - 0.01))).normalize();
          const normal = new THREE.Vector3().crossVectors(tangent, facing).normalize();
          const side = new THREE.Vector3().crossVectors(normal, tangent);
          const width = widthAt(t);
          for (let column = 0; column < 5; column++) {
            const u = (column - 2) / 2;
            const curl = (u * u * Math.sin(t * 24 + u * 2) * fold - (1 - u * u) * 0.18) * width;
            const vertex = point.clone().addScaledVector(side, u * width).addScaledVector(normal, curl);
            positions.push(rootX + vertex.x, rootY + vertex.y, rootZ + vertex.z);
            bends.push(rootX, rootZ, Math.max(0, vertex.y));
            color.copy(dark).lerp(light, 0.22 + 0.48 * t + 0.23 * Math.abs(u) + 0.06 * Math.sin(t * 24));
            color.toArray(colors, colors.length);
            if (section > 0 && column > 0) {
              const index = first + section * 5 + column;
              indices.push(index - 6, index - 5, index, index - 6, index, index - 1);
            }
          }
        }
      }

      addRibbon(stemAt, new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)), t => 0.18 - 0.14 * t, 0.08, 12);
      const leaves = Math.floor(6 + height * 0.28);
      for (let leaf = 0; leaf < leaves; leaf++) {
        const t = 0.16 + leaf / leaves * 0.79;
        const start = stemAt(t);
        const direction = angle + leaf * 2.4 + 0.6 * habitatRandom();
        const along = new THREE.Vector3(Math.cos(direction), 0, Math.sin(direction));
        const across = new THREE.Vector3(-along.z, 0, along.x);
        const length = height * (0.19 + 0.28 * habitatRandom()) * (1 - 0.36 * t);
        const width = 0.22 + length * (0.10 + 0.075 * habitatRandom());
        const path = u => start.clone()
          .addScaledVector(along, length * u * (0.57 + 0.25 * u))
          .addScaledVector(across, length * 0.13 * Math.sin(u * 3.8) * u)
          .setY(start.y + length * (0.57 * Math.sin(2 * u) - 0.28 * u * u));
        addRibbon(path, across, u => width * Math.pow(Math.sin(Math.PI * u), 0.78) + 0.013, 0.43, 10);
      }
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.setAttribute("kelpBend", new THREE.Float32BufferAttribute(bends, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  geometry.boundingSphere.radius += 6;
  return geometry;
}

function createSeagrassGeometry(patches) {
  const positions = [];
  const colors = [];
  const bends = [];
  const indices = [];
  const rootColor = new THREE.Color(0x294533);
  const tipColor = new THREE.Color(0x708d4d);
  const color = new THREE.Color();
  const sections = 7;
  for (const { x, z, size } of patches) {
    for (let tuft = 0; tuft < 5; tuft++) {
      const bearing = habitatRandom() * Math.PI * 2;
      const distance = size * (0.93 + 0.9 * habitatRandom());
      const tuftX = x + Math.cos(bearing) * distance;
      const tuftZ = z + Math.sin(bearing) * distance;
      for (let blade = 0; blade < 10; blade++) {
        const azimuth = habitatRandom() * Math.PI * 2;
        const alongX = Math.cos(azimuth);
        const alongZ = Math.sin(azimuth);
        const rootX = tuftX + (habitatRandom() - 0.5) * 4;
        const rootZ = tuftZ + (habitatRandom() - 0.5) * 4;
        const rootY = seabedY(rootX, rootZ) - 0.13;
        const length = 1.4 + habitatRandom() * 3.4;
        const first = positions.length / 3;
        for (let step = 0; step <= sections; step++) {
          const t = step / sections;
          const reach = length * 0.53 * t * t;
          const height = length * Math.sin(t * 1.32);
          const width = (0.17 + 0.13 * Math.sin(Math.PI * t)) * (1 - 0.94 * t);
          color.copy(rootColor).lerp(tipColor, 0.18 + 0.64 * t);
          for (const side of [-1, 1]) {
            positions.push(rootX + alongX * reach - alongZ * width * side,
              rootY + height, rootZ + alongZ * reach + alongX * width * side);
            bends.push(rootX, rootZ, height * 1.45);
            color.toArray(colors, colors.length);
          }
          if (step > 0) {
            const i = first + step * 2;
            indices.push(i - 2, i, i + 1, i - 2, i + 1, i - 1);
          }
        }
      }
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.setAttribute("kelpBend", new THREE.Float32BufferAttribute(bends, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const habitatTime = { value: 0 };
const kelpMat = new THREE.MeshStandardMaterial({

};

// 水流（フローフィールド）：物理計算ではなく「位置→流速」を返すあらかじめ決めた場。
// 毎フレーム位置に加算する（移流）ので、魚もサメも同じ水に流される
params.flowType = "none";
params.flowStrength = 0.1;
document.getElementById("flowType").addEventListener("change", e => params.flowType = e.target.value);
bind("flowStrength", "flowStrength", false, "flowVal");

let flowTime = 0;
const _flow = new THREE.Vector3();
function flowAt(pos, out) {
  const s = params.flowStrength;
  out.set(0, 0, 0);
  if (s === 0 || params.flowType === "none") return out;
  if (params.flowType === "current") {
    out.set(1, 0, 0.25).normalize().multiplyScalar(s);
  } else if (params.flowType === "vortex") {
    // Y軸まわりの剛体回転（外側ほど速く、壁際で最大流速 s）
    out.set(-pos.z, 0, pos.x).multiplyScalar(s / BOUNDS.x);
  } else if (params.flowType === "turbulence") {
    // 時間変化する正弦波の重ね合わせによる擬似乱流
    const t = flowTime;
    out.set(
      Math.sin(0.06 * pos.y + t * 0.7) * Math.cos(0.05 * pos.z + t * 0.4),
      Math.sin(0.06 * pos.z + t * 0.5) * Math.cos(0.05 * pos.x + t * 0.6),
      Math.sin(0.06 * pos.x + t * 0.6) * Math.cos(0.05 * pos.y + t * 0.5)
    ).multiplyScalar(s);
  }
  return out;
}

// ---- Boid（InstancedMesh で描画） ----
const MAX_BOIDS = 1000;

const FISH_TYPES = {
  default:  { body: [0.37, 0.62, 1.62], tail: [1.10, 0.92, 0.57], back: 0x395e83, flank: 0x83c6d5, belly: 0xd1e2d8, fin: 0x669ab0, markings: 0 },
  aji:      { body: [0.32, 0.54, 1.86], tail: [1.25, 1.03, 0.70], back: 0x3d6465, flank: 0xb2ccce, belly: 0xe1e8dc, fin: 0x8caa87, markings: 1 },
  kumanomi: { body: [0.43, 0.70, 1.30], tail: [0.73, 0.67, 0.10], back: 0xae3e15, flank: 0xf57f27, belly: 0xfaa04b, fin: 0xc55b24, markings: 2 },
};

// 尾柄から吻までの断面。各行は前後位置、幅、高さ、断面中心の高さ。
const FISH_PROFILE = [
  [-1, 0.19, 0.15, 0.02], [-0.87, 0.26, 0.20, 0.01], [-0.67, 0.58, 0.41, 0.02],
  [-0.45, 0.82, 0.67, 0.03], [-0.20, 0.97, 0.91, 0.05], [0.06, 1, 1, 0.04],
  [0.30, 0.99, 0.96, 0], [0.51, 0.91, 0.81, -0.03], [0.72, 0.73, 0.56, -0.06],
  [0.90, 0.48, 0.28, -0.13], [0.99, 0.24, 0.12, -0.15], [1.02, 0.09, 0.045, -0.15],
];

function buildFishBody(type) {
  const [width, height, length] = type.body;
  const positions = [];
  const colors = [];
  const indices = [];
  const sides = 20;
  const back = new THREE.Color(type.back);
  const flank = new THREE.Color(type.flank);
  const belly = new THREE.Color(type.belly);
  const color = new THREE.Color();
  FISH_PROFILE.forEach(([z, w, h, centerY], ring) => {
    for (let side = 0; side < sides; side++) {
      const angle = side / sides * Math.PI * 2;
      const y = Math.sin(angle);
      positions.push(Math.cos(angle) * w * width, (centerY + y * h) * height, z * length);
      color.copy(flank)
        .lerp(back, Math.pow(Math.max(y, 0), 1.6))
        .lerp(belly, Math.pow(Math.max(-y, 0), 1.55))
        .multiplyScalar(0.91 + 0.09 * Math.cos(z * 2));
      color.toArray(colors, colors.length);
      const i = ring * sides + side;
      const next = ring * sides + (side + 1) % sides;
      if (ring > 0) indices.push(i - sides, next - sides, i, next - sides, next, i);
      if (side > 0 && side < sides - 1) {
        if (ring === 0) indices.push(0, next, i);
        if (ring === FISH_PROFILE.length - 1) indices.push(ring * sides, i, next);
      }
    }
  });

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

// 薄いヒレの外周と中心を結び、先端を暗くして筋の明暗をつける。
function buildFishFin(center, outline, tint) {
  const rim = outline.flatMap((point, i) => {
    const next = outline[(i + 1) % outline.length];
    return [0.16, 0.84].map(t => point.map((axis, j) => THREE.MathUtils.lerp(axis, next[j], t)));
  });
  const positions = [...center, ...rim.flat()];
  const colors = [];
  const indices = [];
  const color = new THREE.Color(tint);
  const shade = new THREE.Color();
  shade.copy(color).multiplyScalar(0.88).toArray(colors, 0);
  rim.forEach((_, i) => {
    shade.copy(color).multiplyScalar(i % 2 === 0 ? 0.72 : 0.56).toArray(colors, colors.length);
    indices.push(0, i + 1, (i + 1) % rim.length + 1);
  });
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function buildFishEye(side, width, height, length) {
  const eye = new THREE.SphereGeometry(1, 10, 6);
  eye.rotateZ(-side * Math.PI / 2);
  const vertices = eye.getAttribute("position");
  const colors = new Float32Array(vertices.count * 3);
  const pupil = new THREE.Color(0x07131a);
  const iris = new THREE.Color(0xa99767);
  const rim = new THREE.Color(0x203739);
  const color = new THREE.Color();
  for (let i = 0; i < vertices.count; i++) {
    const facing = vertices.getX(i) * side;
    color.copy(rim).lerp(iris, THREE.MathUtils.smoothstep(facing, 0.15, 0.48))
      .lerp(pupil, THREE.MathUtils.smoothstep(facing, 0.63, 0.89));
    color.toArray(colors, i * 3);
  }
  eye.deleteAttribute("uv");
  eye.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  eye.scale(width * 0.27, height * 0.23, height * 0.25);
  eye.translate(side * width * 0.75, height * 0.19, length * 0.67);
  return eye;
}

const swimPhases = new THREE.InstancedBufferAttribute(new Float32Array(MAX_BOIDS), 1);
swimPhases.setUsage(THREE.DynamicDrawUsage);

function buildFishGeometry(type) {
  const [w, h, l] = type.body;
  const [tailLength, span, fork] = type.tail;
  const tailRoot = -l + 0.09;
  const body = buildFishBody(type);
  const parts = [
    body,
    buildFishFin([0, 0, tailRoot - tailLength * 0.24], [
      [0, h * 0.12, tailRoot], [0, span * 0.51, tailRoot - tailLength * 0.46],
      [0, span, tailRoot - tailLength * 0.91], [0, span * 0.69, tailRoot - tailLength],
      [0, 0, tailRoot - tailLength * (1 - fork)], [0, -span * 0.67, tailRoot - tailLength * 0.98],
      [0, -span * 0.95, tailRoot - tailLength * 0.87], [0, -span * 0.47, tailRoot - tailLength * 0.43],
      [0, -h * 0.10, tailRoot],
    ], type.fin),
    buildFishFin([0.026, h * 1.05, -l * 0.06], [
      [0, h * 0.84, l * 0.39], [0, h * 1.30, l * 0.16], [0, h * 1.51, -l * 0.04],
      [0, h * 1.30, -l * 0.34], [0, h * 0.48, -l * 0.65], [0, h * 0.56, -l * 0.38],
    ], type.fin),
    buildFishFin([0.019, -h * 0.68, -l * 0.40], [
      [0, -h * 0.63, -l * 0.20], [0, -h * 0.94, -l * 0.39],
      [0, -h * 0.80, -l * 0.55], [0, -h * 0.26, -l * 0.73],
    ], type.fin),
  ];
  for (const side of [-1, 1]) {
    parts.push(buildFishEye(side, w, h, l));
    parts.push(buildFishFin([side * w * 1.09, -h * 0.37, l * 0.18], [
      [side * w * 0.83, -h * 0.15, l * 0.47], [side * w * 1.39, -h * 0.58, l * 0.12],
      [side * w * 1.49, -h * 0.86, -l * 0.30], [side * w * 1.16, -h * 0.58, -l * 0.05],
      [side * w * 0.86, -h * 0.30, l * 0.40],
    ], type.fin));
  }

  for (const part of parts) {
    const marks = new Float32Array(part.getAttribute("position").count);
    if (part === body) marks.fill(1);
    part.setAttribute("fishSkin", new THREE.BufferAttribute(marks, 1));
  }
  const geometry = mergeGeometries(parts);
  geometry.setAttribute("swimPhase", swimPhases);
  return geometry;
}

const fishLength = { value: FISH_TYPES.default.body[2] };
const fishHeight = { value: FISH_TYPES.default.body[1] };
const fishMarkings = { value: FISH_TYPES.default.markings };
const boidMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.39 });
boidMat.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, { fishLength, fishHeight, fishMarkings });
  shader.vertexShader = `
    attribute float fishSkin;
    attribute float swimPhase;
    uniform float fishLength;
    uniform float fishHeight;
    varying vec3 skinPosition;
    void swimBend(float z, out float displacement, out float slope) {
      float tail = max(0.0, 0.23 - z / fishLength);
      float phase = swimPhase + 2.9 * z / fishLength;
      displacement = 0.13 * tail * tail * sin(phase);
      slope = 0.13 * tail * (-2.0 * sin(phase) + 2.9 * tail * cos(phase)) / fishLength;
    }
  ` + shader.vertexShader.replace("#include <beginnormal_vertex>", `
    #include <beginnormal_vertex>
    float displacement;
    float slope;
    swimBend(position.z, displacement, slope);
    objectNormal.z -= slope * objectNormal.x;
  `).replace("#include <begin_vertex>", `
    #include <begin_vertex>
    transformed.x += displacement;
    skinPosition = vec3(position.y / fishHeight, position.z / fishLength, fishSkin);
  `);
  shader.fragmentShader = `
    uniform float fishMarkings;
    varying vec3 skinPosition;
    float stripe(float distance, float halfWidth) {
      float edge = max(fwidth(distance), 0.002);
      return 1.0 - smoothstep(halfWidth - edge, halfWidth + edge, abs(distance));
    }
  ` + shader.fragmentShader.replace("#include <color_fragment>", `
    #include <color_fragment>
    float y = skinPosition.x;
    float z = skinPosition.y;
    vec3 skinColor = diffuseColor.rgb;
    if (fishMarkings > 1.5) {
      float head = z - (0.49 + 0.095 * y);
      float middle = z - (-0.16 + 0.18 * (1.0 - y * y) + 0.08 * y);
      float tail = z - (-0.86 + 0.07 * y * y);
      float edge = max(stripe(head, 0.12), max(stripe(middle, 0.17), stripe(tail, 0.085)));
      float white = max(stripe(head, 0.085), max(stripe(middle, 0.125), stripe(tail, 0.057)));
      skinColor = mix(skinColor, vec3(0.022, 0.015, 0.012), edge);
      skinColor = mix(skinColor, vec3(0.76, 0.82, 0.75), white);
    } else if (fishMarkings > 0.5) {
      float lateral = stripe(y - (0.03 + 0.18 * exp(-6.0 * z * z)), 0.048);
      skinColor = mix(skinColor, vec3(0.46, 0.39, 0.13), lateral * (1.0 - smoothstep(0.25, 0.57, z)) * 0.57);
    }
    float gill = stripe(z - (0.48 - 0.26 * (1.0 - y * y)), 0.018);
    float mouth = stripe(y + 0.14 - (z - 0.85) * 0.09, 0.023) * smoothstep(0.84, 0.99, z);
    float gillShade = 0.28 * gill * (1.0 - smoothstep(0.48, 0.79, abs(y)));
    skinColor *= 1.0 - gillShade - 0.35 * mouth;

    vec2 scales = vec2(z * 21.0, y * 11.0);
    float scaleFade = 1.0 - smoothstep(0.26, 0.88, length(fwidth(scales)));
    float scaleRim = cos(6.283 * (scales.x + 0.18 * cos(6.283 * scales.y)));
    float scaleArea = 1.0 - smoothstep(-0.32, 0.56, z);
    skinColor *= 1.0 + 0.075 * scaleRim * scaleFade * scaleArea;
    diffuseColor.rgb = mix(diffuseColor.rgb, skinColor, skinPosition.z);
  `).replace("#include <emissivemap_fragment>", `
    #include <emissivemap_fragment>
    // 水中の散乱光で側面の色が陰でも見えるようにする。
    float fill = 0.14 + 0.12 * skinPosition.z * (1.0 - smoothstep(0.20, 0.84, abs(skinPosition.x)));
    totalEmissiveRadiance += diffuseColor.rgb * fill;
  `);
};

const boidMesh = new THREE.InstancedMesh(buildFishGeometry(FISH_TYPES.default), boidMat, MAX_BOIDS);
boidMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
boidMesh.frustumCulled = false;
scene.add(boidMesh);

document.getElementById("fishType").addEventListener("change", e => {
  const type = FISH_TYPES[e.target.value];
  const old = boidMesh.geometry;
  boidMesh.geometry = buildFishGeometry(type);
  old.deleteAttribute("swimPhase");
  old.dispose();
  fishLength.value = type.body[2];
  fishHeight.value = type.body[1];
  fishMarkings.value = type.markings;
});

// ---- 捕食者 ----
// シンプル版: 群れの重心へ直線等速で突進するだけの「動く環境」（エージェントではない）
// ABM版: 最近傍の魚を知覚して追跡する操舵エージェント。スタミナが尽きると直進離脱。
//        捕獲判定はなし（擾乱実験用）
let predator = null;

// サメの形状（+Z が進行方向）：魚雷型の胴体＋大きな背びれ＋縦長の尾びれ＋左右の胸びれ
function buildSharkGeometry() {
  const body = new THREE.SphereGeometry(1, 14, 10);
  body.scale(0.5, 0.7, 2.1);

  // 背びれ：サメらしさの要。大きめの薄い三角
  const dorsal = new THREE.ConeGeometry(0.55, 1.1, 4);
  dorsal.scale(0.14, 1, 1);
  dorsal.translate(0, 1.0, 0.1);

  // 尾びれ：縦に大きく
  const tail = new THREE.ConeGeometry(1.0, 1.4, 4);
  tail.rotateX(Math.PI / 2);
  tail.rotateZ(Math.PI / 2);
  tail.scale(0.14, 1.3, 1);
  tail.translate(0, 0.15, -2.6);

  // 胸びれ×2：斜め下外向きに張り出す
  const finL = new THREE.ConeGeometry(0.4, 1.0, 4);
  finL.scale(0.14, 1, 1);
  finL.rotateZ(-Math.PI * 2 / 3);
  finL.translate(0.55, -0.2, 0.6);
  const finR = new THREE.ConeGeometry(0.4, 1.0, 4);
  finR.scale(0.14, 1, 1);
  finR.rotateZ(Math.PI * 2 / 3);
  finR.translate(-0.55, -0.2, 0.6);

  return mergeGeometries([body, dorsal, tail, finL, finR]);
}

const predMat = new THREE.MeshStandardMaterial({ color: 0xff5c5c, roughness: 0.4 });
const predatorMesh = new THREE.Mesh(buildSharkGeometry(), predMat);
predatorMesh.scale.setScalar(2.2);
predatorMesh.visible = false;
scene.add(predatorMesh);

function spawnPredator(mode) {
  const c = new THREE.Vector3();
  for (const b of boids) c.add(b.pos);
  c.divideScalar(boids.length);
  // 出現は横〜上方のみ（海底の下から湧かない）
  const dir = new THREE.Vector3().randomDirection();
  dir.y = Math.abs(dir.y) * 0.6;
  const pos = dir.normalize().multiplyScalar(BOUNDS.length() + 40);
  const speed = mode === "simple" ? Math.max(1.0, params.maxSpeed * 3) : params.maxSpeed * 1.5;
  const vel = c.sub(pos).normalize().multiplyScalar(speed);
  predator = { mode, pos, vel, stamina: 600 }; // スタミナ約10秒（ABM版のみ消費）
  predMat.color.set(mode === "abm" ? 0xff9c3c : 0xff5c5c);
  predatorMesh.visible = true;
}
document.getElementById("attackSimple").addEventListener("click", () => spawnPredator("simple"));
document.getElementById("attackAbm").addEventListener("click", () => spawnPredator("abm"));

const _pSteer = new THREE.Vector3();
function updatePredator() {
  if (!predator) return;
  const p = predator;
  if (p.mode === "abm" && p.stamina > 0 && boids.length > 0) {
    // 知覚: 最近傍の魚を狙い直す
    let target = null, bd = Infinity;
    for (const b of boids) {
      const d2 = b.pos.distanceToSquared(p.pos);
      if (d2 < bd) { bd = d2; target = b; }
    }
    // 操舵: 魚より少し速いが、旋回はやや鈍め（獲物側に回避の余地を残す）
    const pSpeed = params.maxSpeed * 1.5;
    const pForce = 0.02;
    _pSteer.subVectors(target.pos, p.pos).setLength(pSpeed).sub(p.vel).clampLength(0, pForce);
    p.vel.add(_pSteer);
    if (p.vel.length() > pSpeed) p.vel.setLength(pSpeed);
    p.stamina--;
  }
  p.pos.add(p.vel);
  p.pos.add(flowAt(p.pos, _flow)); // サメも同じ水に流される
  // 海底より下には行かせない（砂の下からの出入りを禁止）
  if (p.pos.y < FLOOR_Y) {
    p.pos.y = FLOOR_Y;
    if (p.vel.y < 0) p.vel.y = 0;
  }
  const out =
    Math.abs(p.pos.x) > BOUNDS.x + 60 ||
    Math.abs(p.pos.y) > BOUNDS.y + 60 ||
    Math.abs(p.pos.z) > BOUNDS.z + 60;
  if (out && (p.mode === "simple" || p.stamina <= 0)) {
    predator = null;
    predatorMesh.visible = false;
  }
}

class Boid {
  constructor() {
    this.pos = new THREE.Vector3(
      (Math.random() * 2 - 1) * BOUNDS.x * 0.8,
      (Math.random() * 2 - 1) * BOUNDS.y * 0.8,
      (Math.random() * 2 - 1) * BOUNDS.z * 0.8
    );
    this.vel = new THREE.Vector3().randomDirection().multiplyScalar(params.maxSpeed * 0.7);
    this.acc = new THREE.Vector3();
    this.swimPhase = Math.random() * Math.PI * 2;
  }
}

const boids = [];
function syncCount() {
  while (boids.length < params.count) boids.push(new Boid());
  boids.length = params.count;
  boidMesh.count = params.count;
}
syncCount();

// ---- 空間グリッド ----
function buildGrid(cellSize) {
  const grid = new Map();
  for (const b of boids) {
    const key =
      Math.floor(b.pos.x / cellSize) + "," +
      Math.floor(b.pos.y / cellSize) + "," +
      Math.floor(b.pos.z / cellSize);
    let cell = grid.get(key);
    if (!cell) grid.set(key, cell = []);
    cell.push(b);
  }
  return grid;
}

function forEachNeighbor(grid, cellSize, b, fn) {
  const cx = Math.floor(b.pos.x / cellSize);
  const cy = Math.floor(b.pos.y / cellSize);
  const cz = Math.floor(b.pos.z / cellSize);
  for (let gx = cx - 1; gx <= cx + 1; gx++)
    for (let gy = cy - 1; gy <= cy + 1; gy++)
      for (let gz = cz - 1; gz <= cz + 1; gz++) {
        const cell = grid.get(gx + "," + gy + "," + gz);
        if (!cell) continue;
        for (const other of cell) if (other !== b) fn(other);
      }
}

const _steer = new THREE.Vector3();
function steer(b, desired, weight) {
  if (desired.lengthSq() === 0) return;
  _steer.copy(desired).setLength(params.maxSpeed).sub(b.vel);
  _steer.clampLength(0, params.maxForce).multiplyScalar(weight);
  b.acc.add(_steer);
}

const _align = new THREE.Vector3();
const _coh = new THREE.Vector3();
const _sep = new THREE.Vector3();
const _diff = new THREE.Vector3();

// kNN 用の再利用バッファ（上位 k 個の挿入選択）
const knnD = new Float64Array(16);
const knnB = new Array(16);

function update() {
  const R = params.perception;
  const topo = params.topological;
  const grid = buildGrid(R);

  flowTime += 0.016;
  updatePredator();

  for (const b of boids) {
    b.acc.set(0, 0, 0);
    _align.set(0, 0, 0);
    _coh.set(0, 0, 0);
    _sep.set(0, 0, 0);
    let n = 0, nSep = 0;
    const sepDist = R * 0.45;

    forEachNeighbor(grid, R, b, other => {
      _diff.subVectors(other.pos, b.pos);
      const d2 = _diff.lengthSq();
      if (d2 > R * R) return;
      if (!topo) {
        n++;
        _align.add(other.vel);
        _coh.add(other.pos);
      }
      if (d2 < sepDist * sepDist && d2 > 0) {
        // 近いほど強く反発（距離の2乗で減衰）
        _sep.addScaledVector(_diff, -1 / d2);
        nSep++;
      }
    });

    // トポロジカル近傍：距離に関係なく近い順 k 個体を整列・結合の相手にする
    // （分離は上の短距離メトリックのまま。Ballerini et al. の SPP 実験と同じ構成）
    if (topo && boids.length > 1) {
      const k = Math.min(params.k, boids.length - 1);
      for (let j = 0; j < k; j++) { knnD[j] = Infinity; knnB[j] = null; }
      for (const other of boids) {
        if (other === b) continue;
        const d2 = other.pos.distanceToSquared(b.pos);
        if (d2 >= knnD[k - 1]) continue;
        let j = k - 1;
        while (j > 0 && knnD[j - 1] > d2) {
          knnD[j] = knnD[j - 1];
          knnB[j] = knnB[j - 1];
          j--;
        }
        knnD[j] = d2;
        knnB[j] = other;
      }
      for (let j = 0; j < k; j++) {
        const other = knnB[j];
        if (!other) break;
        n++;
        _align.add(other.vel);
        _coh.add(other.pos);
      }
    }

    if (n > 0) {
      if (params.alignOn) steer(b, _align.divideScalar(n), params.alignW);
      if (params.cohesionOn) steer(b, _coh.divideScalar(n).sub(b.pos), params.cohesionW);
    }
    if (nSep > 0 && params.separationOn) steer(b, _sep, params.separationW);

    // 捕食者からの逃避
    if (predator) {
      _diff.subVectors(b.pos, predator.pos);
      const d = _diff.length();
      const zone = 25;
      if (d < zone && d > 0) steer(b, _diff, 6 * (zone - d) / zone);
    }

    // 障害物回避
    for (const o of obstacles) {
      _diff.subVectors(b.pos, o.pos);
      const d = _diff.length();
      const zone = o.r + 12;
      if (d < zone && d > 0) {
        const strength = (zone - d) / zone;
        steer(b, _diff, params.obstacleAvoidW * strength);
      }
    }

    // 境界：外に出そうになったら内側へ操舵（ソフトな壁）
    // マージンは制動距離 v²/2a（a = 境界操舵の最大加速度）ぶん広げ、
    // 高速時でも壁の手前で曲がり始められるようにする
    const brake = (params.maxSpeed * params.maxSpeed) / (2 * params.maxForce * params.boundsW);
    const margin = Math.min(8 + brake, 30);
    _diff.set(0, 0, 0);
    if (b.pos.x > BOUNDS.x - margin) _diff.x = -1;
    else if (b.pos.x < -BOUNDS.x + margin) _diff.x = 1;
    if (b.pos.y > BOUNDS.y - margin) _diff.y = -1;
    else if (b.pos.y < -BOUNDS.y + margin) _diff.y = 1;
    if (b.pos.z > BOUNDS.z - margin) _diff.z = -1;
    else if (b.pos.z < -BOUNDS.z + margin) _diff.z = 1;
    if (_diff.lengthSq() > 0) steer(b, _diff, params.boundsW);

    b.vel.add(b.acc);
    const spd = b.vel.length();
    if (spd > params.maxSpeed) b.vel.setLength(params.maxSpeed);
    else if (spd < params.maxSpeed * 0.3) b.vel.setLength(params.maxSpeed * 0.3);
    b.pos.add(b.vel);
    b.pos.add(flowAt(b.pos, _flow)); // 水流による移流

    // 海底より下には行かせない（魚も砂に潜れない）
    if (b.pos.y < FLOOR_Y) {
      b.pos.y = FLOOR_Y;
      if (b.vel.y < 0) b.vel.y = 0;
    }

    // 保険のハードクランプ：操舵で防ぎきれず大きくはみ出した場合のみ、
    // 位置を引き戻して外向きの速度成分を消す
    const slack = 5;
    for (const axis of ["x", "y", "z"]) {
      const limit = BOUNDS[axis] + slack;
      if (b.pos[axis] > limit) {
        b.pos[axis] = limit;
        if (b.vel[axis] > 0) b.vel[axis] = 0;
      } else if (b.pos[axis] < -limit) {
        b.pos[axis] = -limit;
        if (b.vel[axis] < 0) b.vel[axis] = 0;
      }
    }
  }

  // 整列度 φ = |Σ v̂| / N（1: 全員同方向、0: バラバラ）
  if (++phiFrame % 10 === 0) {
    let ux = 0, uy = 0, uz = 0;
    for (const b of boids) {
      const s = b.vel.length() || 1;
      ux += b.vel.x / s;
      uy += b.vel.y / s;
      uz += b.vel.z / s;
    }
    phiEl.textContent = (Math.sqrt(ux * ux + uy * uy + uz * uz) / boids.length).toFixed(2);
  }
}
let phiFrame = 0;
const phiEl = document.getElementById("phiVal");

const _mat = new THREE.Matrix4();
const _quat = new THREE.Quaternion();
const _up = new THREE.Vector3(0, 1, 0);
const _lookTarget = new THREE.Vector3();
const _lookMat = new THREE.Matrix4();
const _scale = new THREE.Vector3(1, 1, 1);

function draw(deltaTime) {
  for (let i = 0; i < boids.length; i++) {
    const b = boids[i];
    _lookTarget.copy(b.pos).add(b.vel);
    // Matrix4.lookAt は「eye から target を見る」カメラ基底（+Z が target→eye 向き）を
    // 作るため、eye と target を逆に渡して +Z（魚の頭）を進行方向に向ける
    _lookMat.lookAt(_lookTarget, b.pos, _up);
    _quat.setFromRotationMatrix(_lookMat);
    _mat.compose(b.pos, _quat, _scale);
    boidMesh.setMatrixAt(i, _mat);
    const speed = b.vel.length();
    const strokesPerSecond = 1.35 + 2.05 * speed / (speed + 0.55);
    b.swimPhase = (b.swimPhase + deltaTime * strokesPerSecond * Math.PI * 2) % (Math.PI * 2);
    swimPhases.setX(i, b.swimPhase);
  }
  boidMesh.instanceMatrix.needsUpdate = true;
  swimPhases.needsUpdate = true;

  if (predator) {
    predatorMesh.position.copy(predator.pos);
    _lookTarget.copy(predator.pos).add(predator.vel);
    _lookMat.lookAt(_lookTarget, predator.pos, _up);
    predatorMesh.quaternion.setFromRotationMatrix(_lookMat);
  }
}

const habitatStart = performance.now();
let lastFrame = habitatStart;
function loop(now) {
  const deltaTime = Math.max(0, Math.min((now - lastFrame) * 0.001, 0.05));
  lastFrame = now;
  habitatTime.value = (now - habitatStart) * 0.001;
  update();
  draw(deltaTime);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
