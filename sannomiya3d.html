<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三宮×Boids ハイブリッド 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #panel {
    position: fixed; top: 12px; left: 12px;
    background: rgba(15, 22, 45, 0.88); color: #dbe4ff;
    border: 1px solid rgba(120, 150, 255, 0.25); border-radius: 10px;
    padding: 14px 16px; font-size: 13px; width: 260px;
    backdrop-filter: blur(6px); user-select: none; z-index: 10;
  }
  #panel h1 { font-size: 15px; margin-bottom: 4px; color: #9db4ff; }
  #sub { font-size: 10px; color: #7284b3; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; margin: 8px 0 2px; }
  .val { color: #8fa3d9; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #6c8cff; }
  button {
    width: 100%; margin-top: 8px; padding: 6px; border-radius: 6px;
    border: 1px solid rgba(120, 150, 255, 0.35); background: rgba(60, 80, 160, 0.35);
    color: #dbe4ff; cursor: pointer; font-size: 13px;
  }
  button:hover { background: rgba(90, 115, 210, 0.45); }
  #hint { margin-top: 10px; font-size: 11px; color: #7284b3; line-height: 1.6; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="panel">
  <h1>三宮×Boids ハイブリッド 3D</h1>
  <div id="sub">力学と実測パラメータは三宮モデル（1993）、<br>3D空間・サメ・魚礁はBoids実装から継承</div>

  <div class="row"><span>群れと同じ方向に泳ごう（成群力）</span><span class="val" id="alignVal">1.0</span></div>
  <input type="range" id="wAlign" min="0" max="3" step="0.1" value="1">

  <div class="row"><span>群れの中心に集まろう（誘引）</span><span class="val" id="cohVal">1.0</span></div>
  <input type="range" id="wCoh" min="0" max="3" step="0.1" value="1">

  <div class="row"><span>他の魚と衝突しないように（反発）</span><span class="val" id="sepVal">1.0</span></div>
  <input type="range" id="wSep" min="0" max="3" step="0.1" value="1">

  <div class="row" style="margin-top: 10px;"><span>個体数 N</span><span class="val" id="countVal">40</span></div>
  <input type="range" id="count" min="10" max="150" step="10" value="40">

  <div class="row"><span>M_b（位置情報を得る尾数）</span><span class="val" id="mbVal">10</span></div>
  <input type="range" id="mb" min="1" max="30" step="1" value="10">

  <div class="row"><span>M_c（速度情報を得る尾数）</span><span class="val" id="mcVal">10</span></div>
  <input type="range" id="mc" min="1" max="30" step="1" value="10">

  <div class="row" style="margin-top: 10px;">
    <label for="wallAttract" style="cursor:pointer;">
      <input type="checkbox" id="wallAttract" style="accent-color:#6c8cff;">
      壁の誘引力（論文準拠・端に溜まる）
    </label>
  </div>

  <div class="row"><span>群れの数 M</span><span class="val" id="schoolVal">–</span></div>

  <button id="reefBtn">魚礁を追加</button>
  <button id="clearReefBtn">魚礁をクリア</button>
  <button id="sharkBtn">サメを放つ</button>
  <button id="resetBtn">リセット</button>

  <div id="hint">
    ドラッグ：視点回転 / ホイール：ズーム<br>
    魚礁（岩）には三宮モデルの反発＋<b>誘引</b>が働き、
    群れが魚礁のまわりに集まる（論文の元々の動機の3D再現）。<br>
    M_b・M_c を下げると群れが分裂しやすくなる。
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// ================= 三宮モデル（単位: cm, g, sec）=================
const TANK = new THREE.Vector3(75, 50, 75); // 半サイズ（150×100×150cmの水槽）
const FLOOR_Y = -TANK.y + 2;
const MASS = 2.58;
const ALPHA2 = 50, DELTA = 50, DPLUS = 5, DMINUS = 20;

// 論文 Table 2（タイリクバラタナゴ実測）の5グループ
const TABLE2 = [
  { a1: -0.00366, a2: 11.9, a3: 35.0, kb1: -6.20, kb2: 4.20, kc: 1.57, al1: 8.47, kwp: 10.6, kwm: 3.19 },
  { a1: -0.00275, a2: 11.0, a3: 38.4, kb1: -6.40, kb2: 4.38, kc: 1.31, al1: 8.44, kwp: 13.1, kwm: 2.90 },
  { a1: -0.00330, a2: 10.9, a3: 37.9, kb1: -4.40, kb2: 3.11, kc: 1.49, al1: 8.35, kwp:  7.3, kwm: 3.58 },
  { a1: -0.00180, a2: 10.6, a3: 46.4, kb1: -5.60, kb2: 2.57, kc: 1.30, al1: 9.64, kwp: 19.8, kwm: 3.91 },
  { a1: -0.00122, a2: 10.4, a3: 52.9, kb1: -6.90, kb2: 4.02, kc: 1.46, al1: 8.88, kwp: 13.8, kwm: 3.17 },
];
const GROUP_COLORS = [0x8fd3ff, 0x7de07d, 0xffe066, 0xff8fa3, 0xc9a0ff];

// wallAttract: 論文準拠では水槽の壁にも誘引力が働くが、3Dでは誘引ゾーン
// （壁から20cm）が体積の約7割を占めて群れが端に溜まるため、デフォルトOFF。
// 誘引は魚礁には常に働く
// wAlign/wCoh/wSep: Boidsの3ルールに対応する倍率（1 = 論文の実測値そのまま）
// 整列=成群力k_c、結合=誘引k²b、分離=近距離反発k¹b に掛かる
const params = { N: 40, Mb: 10, Mc: 10, wallAttract: false, wAlign: 1, wCoh: 1, wSep: 1 };
document.getElementById("wallAttract").addEventListener("change", e => params.wallAttract = e.target.checked);
for (const [id, key, disp] of [["wAlign", "wAlign", "alignVal"], ["wCoh", "wCoh", "cohVal"], ["wSep", "wSep", "sepVal"]]) {
  document.getElementById(id).addEventListener("input", e => {
    params[key] = parseFloat(e.target.value);
    document.getElementById(disp).textContent = parseFloat(e.target.value).toFixed(1);
  });
}
const DT = 0.02, SUBSTEPS = 2;

function bind(id, key, display) {
  const el = document.getElementById(id);
  el.addEventListener("input", () => {
    params[key] = parseInt(el.value);
    if (display) document.getElementById(display).textContent = el.value;
    if (key === "N") { syncMbMcMax(); initFish(); }
  });
}
bind("count", "N", "countVal");
bind("mb", "Mb", "mbVal");
bind("mc", "Mc", "mcVal");

function syncMbMcMax() {
  for (const id of ["mb", "mc"]) {
    const el = document.getElementById(id);
    el.max = Math.min(30, params.N - 1);
    if (parseInt(el.value) > params.N - 1) {
      el.value = params.N - 1;
      el.dispatchEvent(new Event("input"));
    }
  }
}

// ================= シーン =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 350, 900);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(150, 100, 170);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0x8899cc, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(120, 200, 80);
scene.add(dirLight);

const boundsGeo = new THREE.BoxGeometry(TANK.x * 2, TANK.y * 2, TANK.z * 2);
scene.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(boundsGeo),
  new THREE.LineBasicMaterial({ color: 0xeafcff, transparent: true, opacity: 0.6 })
));
scene.add(new THREE.Mesh(boundsGeo, new THREE.MeshBasicMaterial({
  color: 0xbdf3ff, transparent: true, opacity: 0.07, side: THREE.BackSide, depthWrite: false,
})));

const sand = new THREE.Mesh(
  new THREE.CircleGeometry(TANK.x * 2.4, 48),
  new THREE.MeshStandardMaterial({ color: 0xe9dba6, roughness: 1.0 })
);
sand.rotation.x = -Math.PI / 2;
sand.position.y = -TANK.y - 0.5;
scene.add(sand);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ================= 魚の形状（boids3dから継承）=================
function buildFishGeometry() {
  const body = new THREE.SphereGeometry(1, 12, 10);
  body.scale(0.38, 0.62, 1.35);
  const tail = new THREE.ConeGeometry(0.85, 1.1, 4);
  tail.rotateX(Math.PI / 2);
  tail.rotateZ(Math.PI / 2);
  tail.scale(0.12, 1.1, 1);
  tail.translate(0, 0, -1.75);
  const fin = new THREE.ConeGeometry(0.45, 0.6, 4);
  fin.scale(0.12, 1, 1);
  fin.translate(0, 0.75, -0.15);
  return mergeGeometries([body, tail, fin]);
}

const MAX_FISH = 150;
const FISH_SCALE = 1.6; // 形状長約3.7 → 体長約6cm相当
const fishMesh = new THREE.InstancedMesh(
  buildFishGeometry(),
  new THREE.MeshStandardMaterial({ roughness: 0.4 }),
  MAX_FISH
);
fishMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(fishMesh);

// ================= 魚の状態 =================
let fish = [];
function initFish() {
  fish = [];
  for (let i = 0; i < params.N; i++) {
    const g = i % TABLE2.length;
    const p = TABLE2[g];
    const dir = new THREE.Vector3().randomDirection();
    fish.push({
      pos: new THREE.Vector3(
        (Math.random() * 2 - 1) * TANK.x * 0.6,
        (Math.random() * 2 - 1) * TANK.y * 0.6,
        (Math.random() * 2 - 1) * TANK.z * 0.6
      ),
      vel: dir.multiplyScalar(p.a2),
      g,
    });
    fishMesh.setColorAt(i, new THREE.Color(GROUP_COLORS[g]));
  }
  fishMesh.count = params.N;
  fishMesh.instanceColor.needsUpdate = true;
}
initFish();

// ================= 魚礁（球の岩。反発＋誘引が働く）=================
const reefs = [];
const reefMat = new THREE.MeshStandardMaterial({ color: 0x8a7f6a, roughness: 0.95 });
document.getElementById("reefBtn").addEventListener("click", () => {
  const r = 10 + Math.random() * 6;
  const pos = new THREE.Vector3(
    (Math.random() * 2 - 1) * TANK.x * 0.5,
    FLOOR_Y + r * 0.4 + Math.random() * 15,
    (Math.random() * 2 - 1) * TANK.z * 0.5
  );
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), reefMat);
  mesh.position.copy(pos);
  scene.add(mesh);
  reefs.push({ pos, r, mesh });
});
document.getElementById("clearReefBtn").addEventListener("click", () => {
  for (const o of reefs) scene.remove(o.mesh);
  reefs.length = 0;
});
document.getElementById("resetBtn").addEventListener("click", () => { shark = null; sharkMesh.visible = false; initFish(); });

// ================= サメ（boids3dのABM捕食者を継承）=================
function buildSharkGeometry() {
  const body = new THREE.SphereGeometry(1, 14, 10);
  body.scale(0.5, 0.7, 2.1);
  const dorsal = new THREE.ConeGeometry(0.55, 1.1, 4);
  dorsal.scale(0.14, 1, 1);
  dorsal.translate(0, 1.0, 0.1);
  const tail = new THREE.ConeGeometry(1.0, 1.4, 4);
  tail.rotateX(Math.PI / 2);
  tail.rotateZ(Math.PI / 2);
  tail.scale(0.14, 1.3, 1);
  tail.translate(0, 0.15, -2.6);
  return mergeGeometries([body, dorsal, tail]);
}
let shark = null;
const sharkMesh = new THREE.Mesh(buildSharkGeometry(), new THREE.MeshStandardMaterial({ color: 0xff9c3c, roughness: 0.4 }));
sharkMesh.scale.setScalar(4.5);
sharkMesh.visible = false;
scene.add(sharkMesh);

const SHARK_SPEED = 18;  // cm/s（魚の固有速度11cm/sの約1.6倍）
const SHARK_ACC = 10;    // cm/s²（旋回の鈍さ）
const SHARK_ZONE = 40;   // 魚が逃げ始める距離 (cm)
const SHARK_K = 300;     // 逃避力の強さ (dyn)

document.getElementById("sharkBtn").addEventListener("click", () => {
  const dir = new THREE.Vector3().randomDirection();
  dir.y = Math.abs(dir.y) * 0.4;
  const pos = dir.normalize().multiplyScalar(TANK.length() + 40);
  const c = new THREE.Vector3();
  for (const f of fish) c.add(f.pos);
  c.divideScalar(fish.length);
  shark = { pos, vel: c.sub(pos).normalize().multiplyScalar(SHARK_SPEED), stamina: 12 };
  sharkMesh.visible = true;
});

const _s = new THREE.Vector3();
function updateShark(dt) {
  if (!shark) return;
  if (shark.stamina > 0 && fish.length > 0) {
    let target = null, bd = Infinity;
    for (const f of fish) {
      const d2 = f.pos.distanceToSquared(shark.pos);
      if (d2 < bd) { bd = d2; target = f; }
    }
    _s.subVectors(target.pos, shark.pos).setLength(SHARK_SPEED).sub(shark.vel)
      .clampLength(0, SHARK_ACC * dt);
    shark.vel.add(_s);
    if (shark.vel.length() > SHARK_SPEED) shark.vel.setLength(SHARK_SPEED);
    shark.stamina -= dt;
  }
  shark.pos.addScaledVector(shark.vel, dt);
  if (shark.pos.y < FLOOR_Y + 4) { shark.pos.y = FLOOR_Y + 4; if (shark.vel.y < 0) shark.vel.y = 0; }
  const out = Math.abs(shark.pos.x) > TANK.x + 60 || Math.abs(shark.pos.y) > TANK.y + 60 || Math.abs(shark.pos.z) > TANK.z + 60;
  if (out && shark.stamina <= 0) { shark = null; sharkMesh.visible = false; }
}

// ================= 三宮モデルの力（3Dベクトルに一般化）=================

// 個体間誘引力 b(r)。分離倍率は近距離反発 k¹b に、結合倍率は誘引 k²b に掛かる
function bfun(p, r) {
  const kb1 = p.kb1 * params.wSep;
  const kb2 = p.kb2 * params.wCoh;
  if (r <= p.al1) return (kb2 - kb1) * r / p.al1 + kb1;
  if (r <= ALPHA2) return kb2;
  return 0;
}

// 面への反発（d⁺以内で接近時）と誘引（d⁻以内で離脱時）。n = 面から魚へ向かう法線
// attract=false のときは反発のみ（水槽の壁のデフォルト）
function surfaceForce(F, p, n, d, vn, attract) {
  if (vn < 0 && d < DPLUS) {
    F.addScaledVector(n, p.kwp * (-vn) * (DPLUS - d) / DPLUS);
  } else if (attract && vn > 0 && d < DMINUS) {
    F.addScaledVector(n, -p.kwm * vn * (DMINUS - d) / DMINUS);
  }
}

const _F = new THREE.Vector3();
const _d = new THREE.Vector3();
const _n = new THREE.Vector3();

function step(dt) {
  const N = fish.length;
  const Mb = Math.min(params.Mb, N - 1);
  const Mc = Math.min(params.Mc, N - 1);

  // 近い順ソート（トポロジカル近傍）
  const order = fish.map((f, i) => {
    const idx = [];
    for (let j = 0; j < N; j++) if (j !== i) idx.push(j);
    idx.sort((a, b) => fish[a].pos.distanceToSquared(f.pos) - fish[b].pos.distanceToSquared(f.pos));
    return idx;
  });

  const forces = fish.map(() => new THREE.Vector3());

  for (let i = 0; i < N; i++) {
    const f = fish[i];
    const p = TABLE2[f.g];
    const F = forces[i];

    // F1: 前方推進力（固有速度 a² へ向かう）
    const s = f.vel.length() || 1e-9;
    F.addScaledVector(f.vel, -p.a1 * (s - p.a2) * (s - p.a3));

    // F2 第1項: 個体間誘引力（近い順 M_b 尾）
    for (let k = 0; k < Mb; k++) {
      const o = fish[order[i][k]];
      _d.subVectors(o.pos, f.pos);
      const r = _d.length() || 1e-9;
      F.addScaledVector(_d, bfun(p, r) / r);
    }
    // F2 第2項: 成群力（近い順 M_c 尾との速度差の平均）
    for (let k = 0; k < Mc; k++) {
      const o = fish[order[i][k]];
      if (o.pos.distanceTo(f.pos) <= DELTA) {
        F.addScaledVector(_d.subVectors(o.vel, f.vel), p.kc * params.wAlign / Mc);
      }
    }

    // F3a: 水槽の6面（デフォルトは反発のみ。誘引はチェックボックスで切替）
    const wa = params.wallAttract;
    surfaceForce(F, p, _n.set(-1, 0, 0), TANK.x - f.pos.x, -f.vel.x, wa); // x=+TANK.x の面
    surfaceForce(F, p, _n.set(1, 0, 0), f.pos.x + TANK.x, f.vel.x, wa);   // x=-TANK.x の面
    surfaceForce(F, p, _n.set(0, -1, 0), TANK.y - f.pos.y, -f.vel.y, wa);
    surfaceForce(F, p, _n.set(0, 1, 0), f.pos.y + TANK.y, f.vel.y, wa);
    surfaceForce(F, p, _n.set(0, 0, -1), TANK.z - f.pos.z, -f.vel.z, wa);
    surfaceForce(F, p, _n.set(0, 0, 1), f.pos.z + TANK.z, f.vel.z, wa);

    // F3b: 魚礁（球面に対する反発＋誘引 → 群れが魚礁のまわりに滞留する）
    for (const o of reefs) {
      _n.subVectors(f.pos, o.pos);
      const dist = _n.length() || 1e-9;
      _n.divideScalar(dist);
      const d = dist - o.r;             // 球面までの距離
      const vn = f.vel.dot(_n);
      if (d > 0) surfaceForce(F, p, _n, d, vn, true); // 魚礁の誘引は常にON
    }

    // サメからの逃避（個体間反発の数十倍の強い力）
    if (shark) {
      _d.subVectors(f.pos, shark.pos);
      const d = _d.length();
      if (d < SHARK_ZONE && d > 0) {
        F.addScaledVector(_d, SHARK_K * (1 - d / SHARK_ZONE) / d);
      }
    }
  }

  for (let i = 0; i < N; i++) {
    const f = fish[i];
    const p = TABLE2[f.g];
    f.vel.addScaledVector(forces[i], dt / MASS);
    // a³ は不安定平衡点（超えると発散）なので手前でクランプ
    const cap = p.a3 * 0.95;
    if (f.vel.length() > cap) f.vel.setLength(cap);
    f.pos.addScaledVector(f.vel, dt);
    // 保険: 水槽内・海底より上に留める
    for (const ax of ["x", "y", "z"]) {
      const lim = TANK[ax] - 1;
      if (f.pos[ax] > lim) { f.pos[ax] = lim; if (f.vel[ax] > 0) f.vel[ax] *= -1; }
      if (f.pos[ax] < -lim) { f.pos[ax] = -lim; if (f.vel[ax] < 0) f.vel[ax] *= -1; }
    }
    if (f.pos.y < FLOOR_Y) { f.pos.y = FLOOR_Y; if (f.vel.y < 0) f.vel.y = 0; }
  }

  updateShark(dt);
}

// ================= 群れの数（25cm以内を連結とみなす）=================
function countSchools() {
  const N = fish.length;
  const parent = new Int32Array(N);
  for (let i = 0; i < N; i++) parent[i] = i;
  const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  for (let i = 0; i < N; i++)
    for (let j = i + 1; j < N; j++)
      if (fish[i].pos.distanceToSquared(fish[j].pos) < 625) {
        const a = find(i), b = find(j);
        if (a !== b) parent[b] = a;
      }
  const roots = new Set();
  for (let i = 0; i < N; i++) roots.add(find(i));
  return roots.size;
}

// ================= 描画 =================
const _mat = new THREE.Matrix4();
const _quat = new THREE.Quaternion();
const _look = new THREE.Vector3();
const _lookMat = new THREE.Matrix4();
const _up = new THREE.Vector3(0, 1, 0);
const _scale = new THREE.Vector3(FISH_SCALE, FISH_SCALE, FISH_SCALE);

function draw() {
  for (let i = 0; i < fish.length; i++) {
    const f = fish[i];
    _look.copy(f.pos).add(f.vel);
    _lookMat.lookAt(_look, f.pos, _up);
    _quat.setFromRotationMatrix(_lookMat);
    _mat.compose(f.pos, _quat, _scale);
    fishMesh.setMatrixAt(i, _mat);
  }
  fishMesh.instanceMatrix.needsUpdate = true;

  if (shark) {
    sharkMesh.position.copy(shark.pos);
    _look.copy(shark.pos).add(shark.vel);
    _lookMat.lookAt(_look, shark.pos, _up);
    sharkMesh.quaternion.setFromRotationMatrix(_lookMat);
  }
}

let frame = 0;
function loop() {
  for (let k = 0; k < SUBSTEPS; k++) step(DT);
  draw();
  if (++frame % 30 === 0) document.getElementById("schoolVal").textContent = countSchools();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
